# configs/data.yaml — data pipeline configuration

symbol:
  yfinance: "GC=F"       # Gold futures continuous contract
  dukascopy: "XAUUSD"    # Dukascopy instrument name

defaults:
  start: "2015-01-01"
  end: null              # null means today
  base_timeframe: "1m"   # finest resolution used as resampling source
                         # yfinance only provides 1m for last 7 days;
                         # use "1d" for long history via yfinance
  provider: "yfinance"

timeframes:
  # pandas resample rule → output folder name
  "1min":  "1m"
  "5min":  "5m"
  "15min": "15m"
  "1h":    "1h"
  "4h":    "4h"
  "1D":    "1D"

storage:
  base_dir: "data"
  format: "parquet"              # snappy-compressed parquet
  compression: "snappy"
  partition_by: "timeframe"      # data/<timeframe>/gold.parquet

cache:
  enabled: true
  incremental: true              # append only new bars when cache exists

dukascopy:
  # Credentials / connection info (override via env vars or here)
  # DUKASCOPY_USER / DUKASCOPY_PASS env vars take precedence
  user: ""
  password: ""
  tick_filter: "bid"             # bid | ask | mid
